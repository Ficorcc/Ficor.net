name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # 允许 admin 后台通过 GitHub API 手动触发（workflow_dispatch）
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve Node version
        id: node
        shell: bash
        run: |
          if [ -f .nvmrc ]; then
            version="$(cat .nvmrc)"
          else
            version="$(grep -E '"node"\s*:' package.json | head -n 1 | sed -E 's/.*"node"\s*:\s*"([^"]+)".*/\1/')"
          fi
          if [ -z "$version" ]; then
            version="22"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ steps.node.outputs.version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Security audit gate (high+ prod dependencies)
        run: npm run audit:prod

      - name: Run CI gate
        run: npm run ci

      - name: Install admin dependencies
        run: npm run admin:install

      - name: Build admin
        run: npm run ci:admin

  # admin 后台「保存并部署」通过 workflow_dispatch 触发本 workflow。
  # Cloudflare Pages 的 Git 集成只响应 git push，不会响应 workflow 运行，
  # 因此这里在 CI 通过后显式调用 Pages 部署钩子触发重建。
  # push 到 main 时 Pages 会自动构建，无需调用钩子。
  deploy:
    name: Trigger Cloudflare Pages rebuild
    needs: ci
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Call Cloudflare Pages deploy hook
        env:
          CF_PAGES_DEPLOY_HOOK: ${{ secrets.CF_PAGES_DEPLOY_HOOK }}
        run: |
          if [ -z "$CF_PAGES_DEPLOY_HOOK" ]; then
            echo "::error::缺少 CF_PAGES_DEPLOY_HOOK secret。请在仓库 Settings → Secrets and variables → Actions 中配置 Cloudflare Pages 部署钩子 URL。"
            exit 1
          fi
          curl -fsS -X POST "$CF_PAGES_DEPLOY_HOOK"
          echo "已触发 Cloudflare Pages 重建"
